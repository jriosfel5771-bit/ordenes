services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD}"
    ports: ["1433:1433"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build: ./backend
    environment:
      ConnectionStrings__Default: "Server=db,1433;Database=ordenes;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True"
    ports: ["5080:8080"]
    depends_on:
      db: { condition: service_healthy }
    restart: on-failure

  gateway:
    build: ./gateway
    environment:
      ORDERS_SERVICE_URL: "http://api:8080/graphql"
    ports: ["4000:4000"]
    depends_on: [api]
    restart: on-failure

  web:
    build: ./frontend
    ports: ["4200:80"]
    depends_on: [gateway]